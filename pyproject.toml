[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "couverture-sinistre"
version = "0.4.0"
description = "Dire si un sinistre est couvert par des conditions générales d'assurance, en citant les clauses"
# 3.12 au moins : la CI et l'image Docker sont en 3.12, le poste de dev en 3.14. Accepter 3.10 gardait dans
# uv.lock des versions anciennes (et vulnérables) de dépendances pour ces seules versions de Python (DEMARCHE 7.98).
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pdfplumber>=0.10",
    "uvicorn>=0.29",
    "fastapi>=0.115",
    "reportlab>=4",          # la fiche d'analyse en PDF (fiche.py)
]

[project.optional-dependencies]
word = ["python-docx>=1"]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
couverture = "couverture.cli:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

# Le style vérifié par `uvx ruff check` (en local et dans la CI). Écartées, avec leur raison :
# E501 : des descriptions en français, longues par nature ; E741 : `l` pour « ligne », l'usage du projet ;
# E731 : des petites fonctions locales d'une ligne ; B023 : ces fonctions ne servent que dans le tour de boucle
# qui les crée ; UP042 : `StrEnum` changerait `str()` des réponses, qui partent telles quelles dans l'API.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "perso"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "UP", "RUF100"]
ignore = ["E501", "E741", "E731", "B023", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Les fixtures partagées s'importent d'un autre fichier de tests, puis se reçoivent en argument (usage de pytest).
"tests/*" = ["F811"]
