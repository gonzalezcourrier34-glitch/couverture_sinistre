# L'API et les tableaux Grafana, sur le modèle de SortirIA.
#   docker compose up -d --build
#   API     : http://localhost:8021/docs   (clé COUVERTURE_API_KEY, en-tête x-api-key)
#   Grafana : http://localhost:3011        (admin / GRAFANA_ADMIN_PASSWORD)
# Ports choisis pour ne pas gêner SortirIA (3001, 8010) s'il tourne en même temps.
# Les clés (MISTRAL_API_KEY, COUVERTURE_API_KEY) et GRAFANA_ADMIN_PASSWORD viennent du fichier .env.

services:
  app:
    build:
      context: .
    container_name: couverture_app
    env_file: .env
    # Lit les contrats déposés dans data/contrats, puis sert l'API. La base data/base.sqlite est partagée avec Grafana.
    command: sh -c "couverture ingerer && couverture api --hote 0.0.0.0 --port 8001"
    ports:
      - "8021:8001"
    volumes:
      - ./data:/app/data

  grafana:
    image: grafana/grafana:11.3.0
    container_name: couverture_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
    ports:
      - "3011:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data:/donnees:ro       # la base SQLite, en lecture seule
      - grafanadata:/var/lib/grafana

volumes:
  grafanadata:
