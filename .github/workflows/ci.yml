name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SWI-Prolog : sans lui, les tests qui comparent le moteur Prolog à l'oracle Python sont sautés.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swi-prolog-nox
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run couverture versions
      - run: uv run pytest -q