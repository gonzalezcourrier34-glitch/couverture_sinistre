<main class="page">

    <!-- # En-tête -->

    <app-en-tete />


    <!-- # Espace de travail : la déclaration à gauche, la décision à droite -->

    <section class="workspace">

        <section class="panneau declaration" aria-label="Déclaration du sinistre">
            <app-choix-contrat />
            <app-saisie />
        </section>

        <section class="panneau resultat" aria-label="Décision" aria-live="polite">

            @if (ech.erreur()) {
                <div class="alerte" role="alert">{{ ech.erreur() }}</div>
            }

            <!-- L'échange : la première analyse, puis chaque décision après des réponses -->
            @for (etape of ech.etapes(); track $index; let last = $last) {
                <app-etape [courante]="etape" [derniere]="last" />
            } @empty {
                <app-accueil />
            }

            @if (ech.chargement()) {
                <div class="attente" role="status">
                    <span class="spinner" aria-hidden="true"></span>
                    {{ ech.attente() }}
                </div>
            }
        </section>
    </section>


    <!-- # Les fenêtres : l'analyse en cours, l'article entier -->

    <app-suivi />
    <app-article />

    <footer class="pied small">
        Démonstration · conditions générales d’assureurs anonymisés · la décision ne remplace pas l’examen du dossier par un gestionnaire.
    </footer>
</main>
